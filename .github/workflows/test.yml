name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Tests
        run: go test ./...
      # the Windows code is not covered by the tests above, so at least it has to compile
      - name: Vet and build for Windows
        run: |
          GOOS=windows GOARCH=amd64 go vet .
          sudo apt-get update -q && sudo apt-get install -y -q llvm
          sh tools/build.sh
