*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.4 Onest,"Segoe UI Variable","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1{margin:0;font:500 21px/1.2 Geologica,"Segoe UI Variable",sans-serif;letter-spacing:-.01em}
.sub{margin:3px 0 0;color:var(--sec);font-size:13px}
.app{min-height:100vh;display:flex;flex-wrap:wrap}
nav{flex:1 1 172px;background:var(--panel);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:8px;padding:4px 10px 12px;font:500 14px Geologica,sans-serif}
.brand svg{color:var(--acc)}
nav .nv{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:8px;border:0;background:none;width:100%;text-align:left;cursor:pointer;color:var(--sec)}

html{color-scheme:dark;scrollbar-color:var(--line) transparent;scrollbar-width:thin}
html.light{color-scheme:light}
main{flex:999 1 520px;min-width:0;padding:22px 26px 26px}
.wrap{max-width:900px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px}
.metric{background:var(--card);border-radius:10px;padding:11px 14px}
.metric .l,.lab{font-size:12px;color:var(--mut)}
.lab{margin-bottom:4px}

.metric .n{font-size:12px;color:var(--sec);margin-top:1px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 0;min-height:38px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .d{font-size:12px;color:var(--sec);margin-top:1px}
.row .r{flex:none;color:var(--sec);font-size:13px;display:flex;align-items:center;gap:10px}
.row.pick{cursor:pointer}
.row.sel .t{color:var(--acc)}
button,select,input{font:inherit;color:inherit}
.btn{min-height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer}
.btn:hover{border-color:var(--sec)}

.btn.sm{min-height:28px;padding:0 11px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.sw[aria-checked=true] span{left:19px;background:var(--on)}
input[type=text],input[type=number],select{min-height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:0 9px;max-width:220px;font-size:13px}

:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.en{display:grid;gap:12px}

.box{background:var(--card);border-radius:10px;padding:2px 14px}
.mut{color:var(--mut);font-size:13px}

.link{background:none;border:0;color:var(--sec);cursor:pointer;min-height:30px;text-decoration:underline;margin-top:auto;font-size:13px}
